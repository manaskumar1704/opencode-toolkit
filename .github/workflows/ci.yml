name: CI

on:
  push:
    branches: [main, feat/egm-and-agents]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Dependency audit
        # `uv audit` exits non-zero when a known vulnerability is present, so
        # this step is the gate (S-10). Verified: exit 1 on a pinned
        # vulnerable release, exit 0 on a clean tree.
        run: uv audit

      - name: Static security scan
        run: uv run --no-sync python scripts/security_scan.py

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Run tests (excluding browser)
        run: uv run --no-sync pytest -q -m "not browser"

      - name: Run browser tests
        run: uv run --no-sync playwright install --with-deps chromium && uv run --no-sync pytest -q -m "browser"
        continue-on-error: true
