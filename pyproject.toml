[project]
name = "opencode-toolkit"
version = "0.1.0"
description = "octk: context diet, human-in-the-loop gating, and honest metrics for OpenCode agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Manas Kumar", email = "manaskumar1704@gmail.com" },
]
keywords = ["opencode", "mcp", "ai-agents", "context-pruning", "diagnostics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2,<2",
    "playwright>=1.49",
]

[project.urls]
Homepage = "https://github.com/manaskumar1704/opencode-toolkit"
Repository = "https://github.com/manaskumar1704/opencode-toolkit"
Issues = "https://github.com/manaskumar1704/opencode-toolkit/issues"

[project.scripts]
octk = "octk.cli:main"
octk-mcp = "octk.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["octk*"]
exclude = ["tests*", "benchmarks*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["browser: needs Chromium"]